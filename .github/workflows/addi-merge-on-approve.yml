# Gold standard: merge Addi-authored PRs on human Approve, as Addi (GitHub App).
# Opt-in: vars.ADDI_MERGE_ON_APPROVE=true + ADDI_CLIENT_ID + ADDI_APP_PRIVATE_KEY.
# See team-setup/docs/addi-pr-automation-standard.md
name: Addi merge on Approve

on:
  # Best-effort — delivery is flaky on some PRs; do not rely on this alone.
  pull_request_review:
    types: [submitted]
  # Preferred reliable path: Addi App webhook bridge → repository_dispatch.
  repository_dispatch:
    types: [addi-merge-on-approve]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to attempt merge (as Addi)
        required: true
        type: string
  # After checks complete, retry Approved Addi PRs (covers Approve-then-green).
  # Names not present in a given repo simply never fire, so this list is the
  # union across repos — DCO is the only required check on the docs repos.
  workflow_run:
    workflows: [CI, PR Checks, DCO]
    types: [completed]
  # Last-resort poll (GitHub may delay or skip schedules on quiet repos).
  schedule:
    - cron: '*/10 * * * *'

# Single repo-wide group: different event shapes (review, dispatch,
# workflow_run, schedule) used to land in different per-key groups and race
# each other on the same PR — observed as a double sdlc-run-launch emission.
# Serializing all runs makes the claim/success status dedup sound.
concurrency:
  group: addi-merge-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  merge:
    if: ${{ vars.ADDI_MERGE_ON_APPROVE == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Require Addi App credentials
        env:
          CLIENT_ID: ${{ vars.ADDI_CLIENT_ID }}
          HAS_KEY: ${{ secrets.ADDI_APP_PRIVATE_KEY != '' }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ "$HAS_KEY" != "true" ]; then
            echo "::error::Set vars.ADDI_CLIENT_ID and secrets.ADDI_APP_PRIVATE_KEY (see team-setup/docs/addi-pr-automation-standard.md)"
            exit 1
          fi

      - name: Mint Addi installation token
        id: addi
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.ADDI_CLIENT_ID }}
          private-key: ${{ secrets.ADDI_APP_PRIVATE_KEY }}

      - name: Resolve PR numbers
        id: prs
        env:
          GH_TOKEN: ${{ steps.addi.outputs.token }}
          EVENT_NAME: ${{ github.event_name }}
          REVIEW_PR: ${{ github.event.pull_request.number }}
          REVIEW_STATE: ${{ github.event.review.state }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          DISPATCH_PR: ${{ inputs.pr_number }}
          PAYLOAD_PR: ${{ github.event.client_payload.pr_number }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
          ALLOW_ANY_AUTHOR: ${{ vars.ADDI_MERGE_ANY_AUTHOR }}
        run: |
          set -euo pipefail
          echo "event_name=$EVENT_NAME review_state=${REVIEW_STATE:-}"

          numbers=""
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            numbers="$DISPATCH_PR"
          elif [ "$EVENT_NAME" = "repository_dispatch" ]; then
            numbers="${PAYLOAD_PR:-}"
            if [ -z "$numbers" ]; then
              echo "repository_dispatch missing client_payload.pr_number; nothing to do."
              echo "numbers=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          elif [ "$EVENT_NAME" = "pull_request_review" ]; then
            if [ "${REVIEW_STATE:-}" != "approved" ]; then
              echo "Review state is '${REVIEW_STATE:-}' (want approved); nothing to do."
              echo "numbers=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "${HEAD_REPO:-}" != "$REPO" ]; then
              echo "Fork PR (${HEAD_REPO:-unknown}); skip."
              echo "numbers=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            numbers="$REVIEW_PR"
          elif [ "$EVENT_NAME" = "workflow_run" ]; then
            if [ "${WORKFLOW_CONCLUSION:-}" != "success" ]; then
              echo "workflow_run conclusion=${WORKFLOW_CONCLUSION:-}; skip."
              echo "numbers=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # Map head branch/sha → open PR numbers.
            numbers=$(
              gh pr list -R "$REPO" --state open --limit 50 \
                --json number,headRefName,headRefOid,author,reviewDecision,isDraft \
                | jq -r --arg b "${WORKFLOW_HEAD_BRANCH:-}" --arg s "${WORKFLOW_HEAD_SHA:-}" '
                  .[]
                  | select(.isDraft == false)
                  | select(.reviewDecision == "APPROVED")
                  | select(.headRefName == $b or .headRefOid == $s)
                  | .number' \
                | tr '\n' ' ' | sed 's/[[:space:]]*$//'
            )
          else
            # schedule
            jq_filter='.[]
              | select(.isDraft == false)
              | select(.reviewDecision == "APPROVED")
              | select(
                  ($any == "true")
                  or (.author.login == "app/rosetta-s-addi-m")
                  or (.author.login == "rosetta-s-addi-m")
                  or (.author.login == "rosetta-s-addi-m[bot]")
                  or (.author.login == "app/addi-m")
                  or (.author.login == "addi-m")
                  or (.author.login == "addi-m[bot]")
                )
              | .number'
            numbers=$(
              gh pr list -R "$REPO" --state open --limit 50 \
                --json number,author,reviewDecision,isDraft \
                | jq -r --arg any "${ALLOW_ANY_AUTHOR:-}" "$jq_filter" \
                | tr '\n' ' ' | sed 's/[[:space:]]*$//'
            )
          fi

          echo "numbers=${numbers}"
          echo "numbers=${numbers}" >> "$GITHUB_OUTPUT"

      - name: Verify author + gates, then merge as Addi
        if: ${{ steps.prs.outputs.numbers != '' }}
        env:
          GH_TOKEN: ${{ steps.addi.outputs.token }}
          APP_SLUG: ${{ steps.addi.outputs.app-slug }}
          PRS: ${{ steps.prs.outputs.numbers }}
          REPO: ${{ github.repository }}
          ALLOW_ANY_AUTHOR: ${{ vars.ADDI_MERGE_ANY_AUTHOR }}
          CONFLICT_BODY: |
            ## Addi merge-on-approve

            Human Approve received, but this PR is `mergeable=CONFLICTING`.

            I will not force-merge or auto-resolve. An agent must merge/rebase
            onto the base, push, wait for checks, then re-Approve or re-run
            **Addi merge on Approve** via `workflow_dispatch`.

            Stacked PRs: fix the **bottom** (base ← trunk) PR first. Stack
            merges use **merge commits** (never squash). See
            `team-setup/docs/addi-pr-automation-standard.md`.
        run: |
          set -euo pipefail

          is_addi_author() {
            case "$1" in
              app/rosetta-s-addi-m|rosetta-s-addi-m|rosetta-s-addi-m\[bot\]|app/addi-m|addi-m|addi-m\[bot\]) return 0 ;;
              *) return 1 ;;
            esac
          }

          # After a spec PR merges, emit repository_dispatch sdlc-run-launch
          # exactly once per merge SHA (commit-status context is the marker).
          # Non-spec PRs: one file-list call + grep, then return — no clone,
          # no node, no POST.
          maybe_emit_sdlc_run_launch() {
            local PR="$1"
            local files spec_paths merged_sha workdir emit_script result action
            local status_count
            files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate \
              --jq '.[] | select(.status != "removed") | .filename')
            spec_paths=$(printf '%s\n' "$files" \
              | grep -E '^specs/(.+/)?phase-[^/]+-spec\.md$' || true)
            if [ -z "$spec_paths" ]; then
              echo "No specs/**/phase-*-spec.md in PR #$PR; skip sdlc-run-launch."
              return 0
            fi

            merged_sha=$(gh pr view "$PR" -R "$REPO" --json mergeCommit \
              --jq '.mergeCommit.oid // empty')
            if [ -z "$merged_sha" ]; then
              echo "::warning::PR #$PR has no mergeCommit oid; skip sdlc-run-launch."
              return 0
            fi

            # Dedup marker → planner input. Line-based grep is pagination-
            # safe (a per-page `--jq … length` emits one count per page).
            # Only state=success suppresses re-emission: a pending/failure
            # claim from a died-mid-flight attempt must NOT permanently
            # suppress a never-sent signal — re-entry retries it. The
            # planner owns the noop decision (--emitted-sha).
            emitted_flags=""
            if gh api "repos/$REPO/commits/$merged_sha/statuses" --paginate \
              --jq '.[] | select(.context == "sdlc-run-launch" and .state == "success") | .context' \
              | grep -q .; then
              emitted_flags="--emitted-sha $merged_sha"
            fi

            # SECURITY: extract the planner from trusted default-branch HEAD,
            # never from the (now-deleted) PR head — same rule as the flip.
            workdir=$(mktemp -d)
            git clone --quiet --depth 1 --no-tags --filter=blob:none \
              "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "$workdir"
            emit_script="$(mktemp -d)/emit-sdlc-run-launch.mjs"
            if ! git -C "$workdir" cat-file -e HEAD:team-setup/scripts/emit-sdlc-run-launch.mjs 2>/dev/null; then
              echo "emit-sdlc-run-launch.mjs absent on default branch; skip."
              rm -rf "$workdir"
              return 0
            fi
            if ! git -C "$workdir" show HEAD:team-setup/scripts/emit-sdlc-run-launch.mjs > "$emit_script"; then
              echo "::error::failed to extract emit-sdlc-run-launch.mjs from default-branch HEAD"
              exit 1
            fi
            rm -rf "$workdir"

            result=$(printf '%s\n' "$spec_paths" | node "$emit_script" \
              --plan --merged-sha "$merged_sha" --pr-number "$PR" $emitted_flags)
            echo "$result"
            action=$(echo "$result" | jq -r '.action')
            if [ "$action" != "dispatch" ]; then
              echo "sdlc-run-launch plan is $action; skip POST."
              return 0
            fi

            # Claim (pending) → dispatch → success. Pending/failure claims
            # never suppress re-emission (success-only dedup above), so a
            # dispatch that dies after the claim is retried by the normal
            # MERGED/schedule re-entry — no operator status surgery needed.
            # The narrow duplicate window (job dies between a successful
            # dispatch and the success write) is tolerated: consumers must
            # dedup launches by client_payload.mergedSha.
            gh api --method POST "repos/$REPO/statuses/$merged_sha" \
              -f state=pending \
              -f context=sdlc-run-launch \
              -f description="claiming sdlc-run-launch emission" >/dev/null
            if ! echo "$result" | jq '{event_type, client_payload}' \
              | gh api --method POST "repos/$REPO/dispatches" --input -; then
              gh api --method POST "repos/$REPO/statuses/$merged_sha" \
                -f state=failure \
                -f context=sdlc-run-launch \
                -f description="dispatch POST failed — re-entry will retry" >/dev/null
              echo "::error::sdlc-run-launch dispatch failed on $merged_sha — re-entry retries automatically"
              exit 1
            fi
            gh api --method POST "repos/$REPO/statuses/$merged_sha" \
              -f state=success \
              -f context=sdlc-run-launch \
              -f description="repository_dispatch emitted" >/dev/null
            echo "Emitted sdlc-run-launch for PR #$PR @ $merged_sha"
            return 0
          }

          # On Approve of a PR that adds/changes Draft phase specs, push a
          # Draft→Approved flip commit (as Addi, DCO-signed) before merge.
          # Detection is one read-only file-list call plus grep: non-spec PRs
          # trigger no clone, no node, and take the prior merge path unchanged.
          # `select(.status != "removed")` keeps deleted/renamed-away specs out
          # of the flip entirely.
          maybe_flip_draft_specs() {
            local PR="$1"
            local files spec_paths result action message head_ref bot_login bot_id workdir
            files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate \
              --jq '.[] | select(.status != "removed") | .filename')
            # `(.+/)?` spans nested segments too (`.` matches `/` in ERE), so
            # specs/a/b/phase-1-spec.md is included — same shape as isSpecPath.
            spec_paths=$(printf '%s\n' "$files" \
              | grep -E '^specs/(.+/)?phase-[^/]+-spec\.md$' || true)
            if [ -z "$spec_paths" ]; then
              echo "No specs/**/phase-*-spec.md in PR #$PR; skip status flip."
              return 0
            fi

            head_ref=$(gh pr view "$PR" -R "$REPO" --json headRefName --jq '.headRefName')
            workdir=$(mktemp -d)
            git clone --quiet --no-tags --filter=blob:none \
              "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "$workdir"

            # SECURITY: the flip script is taken from the trusted default
            # branch (the clone's HEAD), never from the PR head — a PR that
            # modifies the script must not get its version executed in this
            # push-credentialed job. Genuinely-absent script (default branch
            # predates the feature) skips the flip; any other extraction
            # error fails the job loudly instead of silently omitting flips.
            flip_script="$(mktemp -d)/flip-spec-status.mjs"
            if ! git -C "$workdir" cat-file -e HEAD:team-setup/scripts/flip-spec-status.mjs 2>/dev/null; then
              echo "flip-spec-status.mjs absent on default branch; skip status flip."
              rm -rf "$workdir"
              return 0
            fi
            if ! git -C "$workdir" show HEAD:team-setup/scripts/flip-spec-status.mjs > "$flip_script"; then
              echo "::error::failed to extract flip-spec-status.mjs from default-branch HEAD"
              exit 1
            fi

            git -C "$workdir" fetch --quiet --no-tags origin "$head_ref"
            git -C "$workdir" checkout --quiet --force -B "flip-pr-$PR" FETCH_HEAD

            result=$(cd "$workdir" && printf '%s\n' "$spec_paths" \
              | node "$flip_script" --write-stdin)
            echo "$result"
            action=$(echo "$result" | jq -r '.action')
            if [ "$action" != "commit" ]; then
              echo "Spec files present but nothing to flip ($action); continue."
              rm -rf "$workdir"
              return 0
            fi

            message=$(echo "$result" | jq -r '.message')
            # `gh api user` 403s under installation tokens; derive identity
            # from the app slug the mint step already knows.
            bot_login="${APP_SLUG}[bot]"
            bot_id=$(gh api "users/${APP_SLUG}%5Bbot%5D" --jq '.id')
            (cd "$workdir" && git add -- $(echo "$result" | jq -r '.flipped[]'))
            git -C "$workdir" -c "user.name=$bot_login" \
              -c "user.email=${bot_id}+${bot_login}@users.noreply.github.com" \
              commit -s -m "$message"
            git -C "$workdir" push origin "HEAD:refs/heads/$head_ref"
            flip_sha=$(git -C "$workdir" rev-parse HEAD)
            rm -rf "$workdir"
            echo "Pushed draft→Approved flip $flip_sha to $head_ref as $bot_login"

            # Re-pin: the checks rollup and merge below must observe the
            # post-flip SHA. Proceeding on a stale pre-flip head would merge
            # content the human never saw flipped — hard-fail instead.
            repinned=""
            for _ in 1 2 3 4 5 6; do
              if [ "$(gh pr view "$PR" -R "$REPO" --json headRefOid --jq '.headRefOid')" = "$flip_sha" ]; then
                repinned="yes"
                break
              fi
              sleep 5
            done
            if [ -z "$repinned" ]; then
              echo "::error::PR #$PR head never advanced to flip commit $flip_sha; aborting before checks/merge."
              exit 1
            fi
            return 0
          }

          process_pr() {
            local PR="$1"
            echo "::group::PR #$PR"
            meta=$(gh pr view "$PR" -R "$REPO" --json \
              author,state,isDraft,reviewDecision,mergeable,mergeStateStatus,url)
            echo "$meta" | jq .

            author=$(echo "$meta" | jq -r '.author.login // empty')
            state=$(echo "$meta" | jq -r '.state')
            draft=$(echo "$meta" | jq -r '.isDraft')
            decision=$(echo "$meta" | jq -r '.reviewDecision // empty')
            mergeable=$(echo "$meta" | jq -r '.mergeable // empty')
            url=$(echo "$meta" | jq -r '.url')

            # Already-merged: retry launch signal only (deduped by merge SHA).
            if [ "$state" = "MERGED" ]; then
              maybe_emit_sdlc_run_launch "$PR"
              echo "PR already MERGED; launch signal checked."
              echo "::endgroup::"
              return 0
            fi
            if [ "$state" != "OPEN" ]; then
              echo "PR not OPEN ($state); nothing to do."
              echo "::endgroup::"
              return 0
            fi
            if [ "$draft" = "true" ]; then
              echo "Draft PR; refusing merge."
              echo "::endgroup::"
              return 0
            fi

            if [ "${ALLOW_ANY_AUTHOR:-}" != "true" ]; then
              if ! is_addi_author "$author"; then
                echo "Author '$author' is not Addi; skip (set ADDI_MERGE_ANY_AUTHOR=true to override)."
                echo "::endgroup::"
                return 0
              fi
            fi

            if [ "$decision" != "APPROVED" ]; then
              echo "reviewDecision is '$decision' (want APPROVED); skip."
              echo "::endgroup::"
              return 0
            fi

            if [ "$mergeable" = "CONFLICTING" ]; then
              if gh api "repos/$REPO/issues/$PR/comments" --jq '.[].body' \
                | grep -Fq '## Addi merge-on-approve'; then
                echo "Conflict comment already present; skip."
                echo "::endgroup::"
                return 0
              fi
              gh pr comment "$PR" -R "$REPO" --body "$CONFLICT_BODY"
              echo "Commented on conflicting PR; exiting 0."
              echo "::endgroup::"
              return 0
            fi

            # Flip Draft→Approved on phase specs before waiting on checks so
            # the flip commit's checks are included in the rollup below.
            maybe_flip_draft_specs "$PR"

            # Do NOT use `gh pr checks --watch` — this job can register as a
            # pending check and deadlock on itself.
            #
            # statusCheckRollup mixes CheckRun (Actions) and StatusContext
            # (legacy commit statuses, e.g. sdlc/reviewer). CheckRuns use
            # status + conclusion (QUEUED/IN_PROGRESS/COMPLETED + SUCCESS/…).
            # StatusContexts use state (PENDING/SUCCESS/FAILURE/ERROR) with
            # status/conclusion null — so `select(.status != "COMPLETED")`
            # treated successful StatusContexts as forever-pending (#384/#385).
            echo "Waiting for checks (excluding this workflow)…"
            local deadline=$((SECONDS + 1200))
            local self_run="${GITHUB_RUN_ID:-}"
            while true; do
              local rollup pending failed
              rollup=$(gh pr view "$PR" -R "$REPO" --json statusCheckRollup)
              pending=$(echo "$rollup" | jq --argjson run "${self_run:-0}" '
                [.statusCheckRollup[]?
                  | select((.workflowName // "") != "Addi merge on Approve")
                  | select((.detailsUrl // "") | contains("/runs/\($run)/") | not)
                  | select(
                      ((.status != null) and (.status != "COMPLETED"))
                      or ((.status == null)
                        and ((.state // "PENDING" | ascii_upcase) == "PENDING"))
                    )]
                | length')
              failed=$(echo "$rollup" | jq --argjson run "${self_run:-0}" '
                [.statusCheckRollup[]?
                  | select((.workflowName // "") != "Addi merge on Approve")
                  | select((.detailsUrl // "") | contains("/runs/\($run)/") | not)
                  | select(
                      ((.status == "COMPLETED")
                        and (.conclusion != "SUCCESS")
                        and (.conclusion != "SKIPPED")
                        and (.conclusion != "NEUTRAL"))
                      or ((.status == null)
                        and ((.state // "" | ascii_upcase) == "FAILURE"
                          or (.state // "" | ascii_upcase) == "ERROR"))
                    )]
                | length')
              if [ "$failed" -gt 0 ]; then
                echo "Checks failed; not merging $url"
                echo "$rollup" | jq .
                echo "::endgroup::"
                return 1
              fi
              if [ "$pending" -eq 0 ]; then
                echo "Non-self checks complete."
                break
              fi
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "Timed out waiting for checks; not merging $url"
                echo "::endgroup::"
                return 1
              fi
              echo "pending=$pending — sleep 15s"
              sleep 15
            done

            mergeable=$(gh pr view "$PR" -R "$REPO" --json mergeable --jq '.mergeable // empty')
            if [ "$mergeable" != "MERGEABLE" ]; then
              echo "After checks, mergeable=$mergeable; not merging."
              echo "::endgroup::"
              return 1
            fi

            # GitHub native stacks require PUT .../merge-async (sync gh pr merge
            # fails). Merging a stacked tip lands the whole stack up to that PR
            # onto the stack base. Unstacked default-branch PRs stay squash.
            # Docs: https://docs.github.com/en/rest/pulls/pulls#merge-a-pull-request-asynchronously
            stack_json=$(gh api "repos/$REPO/pulls/$PR" --jq '.stack // empty')
            if [ -n "$stack_json" ] && [ "$stack_json" != "null" ]; then
              echo "Stacked PR detected: $stack_json"
              echo "Using merge-async (merge commits) for the stack."
              resp=$(gh api --method PUT "repos/$REPO/pulls/$PR/merge-async" \
                -f merge_method=merge \
                -f merge_action=direct_merge)
              echo "$resp" | jq .
              status=$(echo "$resp" | jq -r '.status // empty')
              uuid=$(echo "$resp" | jq -r '.details.uuid // empty')
              if [ "$status" = "merged" ]; then
                echo "Stack already merged as Addi: $url"
                maybe_emit_sdlc_run_launch "$PR"
                echo "::endgroup::"
                return 0
              fi
              if [ "$status" != "pending" ] || [ -z "$uuid" ]; then
                echo "merge-async did not enqueue (status=$status); not merging."
                echo "::endgroup::"
                return 1
              fi
              local deadline=$((SECONDS + 600))
              while true; do
                poll=$(gh api "repos/$REPO/pulls/$PR/merge-async/$uuid")
                echo "$poll" | jq .
                pstatus=$(echo "$poll" | jq -r '.status // empty')
                if [ "$pstatus" = "merged" ]; then
                  echo "Stack merged as Addi: $url"
                  maybe_emit_sdlc_run_launch "$PR"
                  echo "::endgroup::"
                  return 0
                fi
                if [ "$pstatus" = "failed" ] || [ "$pstatus" = "error" ]; then
                  echo "merge-async failed: $(echo "$poll" | jq -r '.details.message // empty')"
                  echo "::endgroup::"
                  return 1
                fi
                if [ "$SECONDS" -ge "$deadline" ]; then
                  echo "Timed out waiting for merge-async $uuid"
                  echo "::endgroup::"
                  return 1
                fi
                sleep 5
              done
            fi

            gh pr merge "$PR" -R "$REPO" --squash --delete-branch
            echo "Merged as Addi: $url"
            maybe_emit_sdlc_run_launch "$PR"
            echo "::endgroup::"
            return 0
          }

          fail=0
          for PR in $PRS; do
            if ! process_pr "$PR"; then
              fail=1
            fi
          done
          exit "$fail"
