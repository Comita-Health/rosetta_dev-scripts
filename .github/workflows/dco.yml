name: DCO

on: [pull_request]

jobs:
  dco:
    name: DCO sign-off check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check every PR commit for Signed-off-by
        run: |
          missing=0
          for sha in $(git rev-list --no-merges \
              ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}); do
            if ! git log -1 --format=%B "$sha" | grep -qiE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::Commit $sha is missing a Signed-off-by trailer. Sign your commits with 'git commit -s' (see CONTRIBUTING.md)."
              missing=1
            fi
          done
          exit $missing
