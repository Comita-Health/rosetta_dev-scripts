name: CI

# No base-branch filter: stacked PRs target feature branches (f/*), and a
# filter of [main] would leave them without CI until they retarget.
on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node is still the runtime for jest; Bun is the package manager.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run team-setup tests with coverage
        run: cd team-setup && bun run test:coverage

      - name: Run sdlc-workflow tests with coverage
        run: cd sdlc-workflow && bun run test:coverage
